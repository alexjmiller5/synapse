swagger: '2.0'
info:
  title: 'Intake API'
  version: '1.0.0'
schemes:
  - https
produces:
  - application/json
paths:
  /process:
    post:
      summary: 'Intake Requests'
      operationId: 'synapse-intaker'
      x-google-backend:
        # This "DUMMY_URL" will be replaced by the CI/CD pipeline
        address: ${synapse_intaker_service_url}
        jwt_audience: ${synapse_intaker_service_url}
      security:
        - api_key_query: []
      responses:
        '200':
          description: 'A successful response'
securityDefinitions:
  api_key_query:
    type: 'apiKey'
    name: 'key'
    in: 'query'