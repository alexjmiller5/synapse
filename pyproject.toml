[project]
name = "synapse"
version = "2.0.0"
description = "An intelligent middleware for capturing thoughts and organizing them in Notion"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["ai", "notion", "automation", "serverless"]
dependencies = [
    "fastapi>=0.115",
    "google-genai~=1.49.0",
    "PyYAML~=6.0.3",
    "requests~=2.32.3",
    "notion-client~=2.7.0",
    "inscriptis~=2.7.0",
    "spotipy~=2.25.1",
    "googlemaps>=4.10.0",
    "google-api-python-client>=2.187.0",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "modal>=1.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that call real external APIs (Gemini, YouTube, etc.)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[project.urls]
"Homepage" = "https://github.com/alexjmiller5/synapse"
"Bug Reports" = "https://github.com/alexjmiller5/synapse/issues"
"Source" = "https://github.com/alexjmiller5/synapse"
