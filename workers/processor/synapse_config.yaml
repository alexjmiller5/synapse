databases:
  tasks:
    description: "A general to-do item, reminder, or action."
    properties:
      Name:
        type: "title"
        required: true
        instruction: "This MUST be the user's original, unmodified text."
      AI Title:
        type: "rich_text"
        required: true
        instruction: "Create a concise, clear title from the text."
      Tags:
        type: "multi_select"
        required: true
        allowlist: ["Gifts", "Shopping", "Work", "Social Planning", "Finances", "Career", "Lakeport", "Capital One", "Chore", "Errand", "Decision", "Learning"]
        instruction: |
          Select the most specific tag using the user's definitions. ONLY SELECT ONE. EVEN IF THOUGH THIS IS A MULTISELECT PROPERTY, I ONLY WANT YOU TO TREAT IT AS A SELECT AND SELECT ONE OF THE TAGS. FOLLOW THIS PRIORITY to avoid misclassification:
          1. "Chore": (DEFAULT) As the user says, "Most tasks are chores to be honest." If it's something quick to do on the computer, in the room, updating a playlist (e.g. Karaoke), editing a profile (dating app), or fixing a technical sync issue, IT IS A CHORE.
          2. "Errand": Whatever involves going out of the house to do it (e.g. picking up dry cleaning, dropping something off at Goodwill).
          3. "Capital One": The user works at Capital One. Use this if related to work or PTO.
          4. "Shopping": Anything related to buying (Amazon, etc). Use "Gifts" if it's a gift idea or buying for someone else.
          5. "Learning": "Something to explore"—like looking through a website, looking into a tool, or figuring out how something works (e.g. "how the python tool uv works").
          6. "Career": General career stuff (not specific to the current Capital One job).
          7. "Social Planning": ONLY if actually scheduling a specific event with other people. Even if it involves interaction with others that doesn't necesarily mean it has this tag -- for this tag it MUST be specifically for me to plan some kind of social event with others. If I have to ask someone something or talk to them about something that's not social planning. Updating a bucket list or profile solo is a CHORE.
      Priority:
        type: "select"
        allowlist: ["Low", "Medium", "High"]
        instruction: |
          Unless there is sepcifically a context section where the user mentions High, Low or Medium priority, DO NOT fill in this category. Leave it empty. If the user does mention priority specifically, use that to fill in this field based on the three available options.
      Links:
        type: "rich_text_list"
        instruction: "Extract all valid URLs (e.g., http, https). Don't need this property if there aren't any urls."
      Due Date:
        type: "date"
        required: true
        instruction: |
          Determine the due date using this priority order:
          1. CHECK CONTEXT: If the user provided a date in the Context/Metadata block (e.g. "January 2025", "next week"), USE THAT DATE.
          2. CHECK TEXT: If no date is in the Context, look for date mentions in the text itself.
          3. FALLBACK: If absolutely no date is found in either, use today: {current_date}.
          *Note: If the user gives a vague date like "January 2025", assume the 1st of that month.*
          *Note: If the user gives a month and day but no year (e.g. "March 5"), assume the next occurrence of that date (e.g. if today is June 2024, "March 5" means March 5, 2025).*
      Status:
        type: "status"
        virtual: true

  groceries:
    description: "A food item or household consumable (ONLY food/drink. Non-food items go to Shopping)."
    properties:
      Name:
        type: "title"
        required: true
        instruction: "Check the 'EXISTING INVENTORY' list provided. If the user's item matches (or is a close variation of) an existing item name, USE THE EXISTING EXACT NAME. If it is truly new, create a singular, Title Case name."
      Category:
        type: "select"
        required: true
        instruction: "Select the most appropriate category from the list."
      Status:
        type: "status"
        required: true
        allowlist: ["On List", "Don't Have", "Have"]
        instruction: "Determine status based on text (e.g. 'need'/'buy' -> 'On List', 'out of'/'empty' -> 'Don't Have', 'got'/'bought' -> 'Have'). Default to 'On List'."

  ideas:
    description: "A random thought, invention idea, app concept, or project idea. Specifically has to have the word idea in it. The user will specify that this is an idea they just had, most of thoughts are tasks. These are likes ideas for a business, idea for a tv show -- something to create. NOT an idea for a gift for somebody or something like that."
    properties:
      Description:
        type: "title"
        required: true
        instruction: "The user's full original text."
      Tags:
        type: "multi_select"
        required: true
        instruction: "Select relevant tags from the list."
      Status:
        type: "status"
        required: true
        allowlist: ["Not started", "In progress", "Bad Idea", "Already Exists"]
        instruction: "Determine status based on confidence/progress."

  quotes:
    description: "A memorable quote or saying (often attributed to a person)."
    properties:
      Quote:
        type: "title"
        required: true
        instruction: "The actual words spoken (e.g., 'I'll be back')"
      Context:
        type: "rich_text"
        required: false
        instruction: "The context in which the quote was said, not necesarily the person who said it unless the conetxt happens to include their name in introduction (e.g., 'From the movie The Terminator' or 'Said by Elon Musk during a 2020 interview'). But not just like 'Elon Musk said' - that is not context, that's just attribution which is already handled elsewhere. You are certainly allowed to leave this field empty"
      Date:
        type: "date"
        virtual: true

  movies:
    description: "A movie title, genre, or film description to watch or rate."
    properties:
      Title:
        type: "title"
        required: true
        instruction: "The official movie title. Try to extract from the user text if necessary -- like if user says 'led zeppelin documentary' the title is 'Becoming Led Zeppelin'. We want actual movies titles here. Also, The official, correctly formatted title. Fix any typos, capitalization, or missing punctuation provided by the user (e.g. 'the avengers' -> 'The Avengers'), DO NOT include the word 'movie' or 'film' in the title unless it is part of the official name (e.g., 'The Lego Movie')."
      Genres:
        type: "multi_select"
        required: true
        instruction: "Select relevant genres."
      Director:
        type: "select"
        instruction: "The director's name (if known)."
      Tags:
        type: "multi_select"
        instruction: "Additional info life if the user specifies it's an All Time favorite, or specifically by Studio Ghibli (the user might specifc that, but if you know that it's a studio ghibli movie even if they don't say that, you should still tag it as such)."
        allowlist: ["All Time Favorite", "Studio Ghibli"]
      Famous Cast Members:
        type: "multi_select"
        instruction: "Famous actors in the movie."
      Status:
        type: "status"
        required: true
        allowlist: ["Priority", "Not Started", "Watched Parts", "In Progress", "Finished", "Gave Up"]
        instruction: |
          Determine the status based on the user's specific phrasing. FOLLOW THIS ORDER:
          1. "Priority": If the user says "need to watch", "must watch", "dying to see", "really want to see", or uses exclamation marks. NOT JUST if they say "watch [movie]" - THAT IS "Not Started".
          2. "Finished": If the user says "watched", "seen", "finished", "completed", or gives a review/rating.
          3. "In Progress": If the user says "watching", "started", or "currently on".
          4. "Gave Up": If the user stopped watching or disliked it.
          5. "Not Started": (DEFAULT) If the user simply mentions the title neutrally (e.g., "The Matrix").
  tv-shows:
    description: "A TV series title to start or track status of."
    properties:
      Title:
        type: "title"
        required: true
        instruction: "The official, correctly formatted title. Try to extract from the user text if necessary -- like if user says 'billy joel series' the title is 'Billy Joel: And So It Goes'. Also if the user  We want actual tv show titles here. Fix any typos, capitalization, or missing punctuation provided by the user (e.g. 'love is blnd habibi' -> 'Love Is Blind: Habibi'), DO NOT include the word 'show', 'series', or 'season' in the title unless it is actually part of the official name (e.g., 'The Morning Show' is okay, but 'Pluribus Show' should just be 'Pluribus')."
      Status:
        type: "status"
        required: true
        allowlist: ["Priority", "Finished", "In Progress", "Not Started"]
        instruction: "Analyze the user's intent. If they imply they finished it (e.g., 'watched', 'seen', 'rate'), use 'Finished'. If they are currently watching, use 'In Progress'. If they just mention the title with no context (e.g., 'The Matrix'), default to 'Not Started'. Or if they say 'Watch [title]' or 'Must watch [title]', use 'Not Started' because the user is essentially tell you they want to watch a movie and haven't. If they mention they gave up, use 'Gave Up'. If they mention watching parts of it, use 'Watched Parts'. If the user says need to watch or must watch or something along those lines, use 'Priority'."
      Genres:
        type: "multi_select"
        required: true
        instruction: "Select relevant genres."
      Director: 
        type: "select"
        instruction: "The director's name (if known)."
      Famous Cast Members:
        type: "multi_select"
        instruction: "Famous actors in the show."

  podcasts:
    description: "A podcast episode or series (MUST contains a Spotify or 'thisamericanlife.org' link). If the user just describes a podcast without a link, classify as a TASK (Chore). Or if they say add these podcasts to my db for example, that is also a task."
    properties:
      Episode Title:
        type: "title"
        required: true
        instruction: "The specific episode title."
      Podcast Name:
        create_new: true
        type: "select"
        required: true
        instruction: "The name of the show."
      Producer:
        create_new: true
        type: "select"
        instruction: "The network/producer."
      Genres:
        type: "multi_select"
        required: true
        instruction: "Relevant genres."
      Status:
        type: "status"
        required: true
        allowlist: ["Not Started", "In Progress", "Finished"]
        instruction: "Finished if listened, In Progress if listening, Not Started otherwise."
      URL:
        type: "url"
        required: true
        instruction: "The valid URL found in the text."
      Date Listened To:
        type: "date"
        virtual: true

  youtube-videos:
    description: "A YouTube video. MUST contain a valid 'youtube.com' or 'youtu.be' or m.youtube.com link. If the user just describes a video without a link, classify as a TASK (Chore)."
    properties:
      Title:
        type: "title"
        required: true
        instruction: "Use the EXACT title provided in the 'Context from URL' section - don't take the id of the video from the actual url. Do not guess or modify it."
      Video URL:
        type: "url"
        required: true
        instruction: "The valid YouTube URL. If missing, this is invalid."
      channel_handle:
        type: "ignore"
        required: true
        instruction: "The creator's handle (e.g. @MKBHD) or channel name. Extract this from the 'Context from URL' metadata if possible."
      Status:
        type: "status"
        required: true
        allowlist: ["Priority", "Not Started", "In Progress", "Watched"]
        instruction: "Default to 'Watched' (assuming user just finished it). Only use 'Not Started' or 'In Progress' if the user explicitly says 'need to watch' or 'watching'."
      Tags:
        type: "multi_select"
        instruction: "Select 'Favorite' if the user praises it highly. Select 'Classic' if implied."

  fun-activities:
    description: "A fun activity, event, or place to visit. User usually specifies a location or implies 'fun thing to do'."
    properties:
      Title:
        type: "title"
        required: true
        instruction: "The specific name of the activity or place (e.g. 'Walk around Union Square', 'Visit Seaport')."
      Location:
        type: "select"
        required: true
        allowlist: ["Boston", "Dallas", "NYC"]
        instruction: |
          Infer the city from the text/landmarks:
          - "NYC": Union Square, Central Park, Brooklyn, Manhattan.
          - "Boston": Seaport, Fenway, Cambridge, The Charles.
          - "Dallas": Deep Ellum, Bishop Arts, Katy Trail.
          - If the location is totally ambiguous, leave empty (the system will create a manual cleanup task).
      Tags:
        type: "multi_select"
        instruction: "Select relevant tags (Food, Nightlife, Social, Cultural, Show). Use 'Food' for restaurants, 'Nightlife' for bars/clubs. Isn't necessary if an item doesn't fit any of these categories or if you're unsue -- it's okay to leave empty. Also cultural really ahs to mean cultural - The Edge in nyc is more of a touristy cool thing but it's not cultural"
      Status:
        type: "status"
        required: true
        allowlist: ["To Do", "Planned", "Done"]
        instruction: "Default to 'To Do'. Use 'Done' if the user implies they already did it."

  people:
    description: "A database for people/contacts. Use ONLY if the user provides a name with context/job info (e.g. 'Arun Vantage senior associate')."
    properties:
      Name:
        type: "title"
        required: true
        instruction: "The full name, Title Cased. If only a first name is given, use that. (e.g. 'will barlow' -> 'Will Barlow')."
      Company:
        type: "rich_text"
        required: true
        instruction: "Extract the context, relationship, or job title provided. (e.g. input: 'Arun Vantage senior associate' -> Company: 'Vantage Senior Associate'. input: 'Will Barlow Theo's camp friend' -> Company: 'Theo's Camp Friend')."

  bookmarks:
    description: "A web bookmark. Triggers if input is a URL (that is NOT YouTube, Spotify, 'thisamericanlife.org', or Google Maps URL)."
    properties:
      Description:
        type: "title"
        required: true
        instruction: |
          This is the Summary property. Write a short summary of what the website is about. 
          - If it's a GitHub link, use the repo description exactly as is.
          - Otherwise, " Write a short 1-2 sentence description of what the website is about (based on the page content preview)."
      Title:
        type: "rich_text"
        required: true
        instruction: "The actual HTML Title of the webpage (from metadata) or the website name.This is the Page Name property. Fill this with the exact 'HTML Title' extracted from the webpage metadata (e.g. 'Socket - Secure your dependencies...'). Do NOT write a summary here."
      URL:
        type: "url"
        required: true
        instruction: "The URL. If the user provides a domain without a protocol (e.g. 'test.com' or 'www.google.com'), you MUST prepend 'https://' to ensure it is a valid link."
      Tags:
        type: "multi_select"
        instruction: "Select 'Github' if the URL contains github.com. Otherwise select relevant tags based on content."

  bucket-list:
    description: "Items to do before dying. Context usually contains 'bucket list'."
    properties:
      Item:
        type: "title"
        required: true
        instruction: "The specific item to do. Use the user's original phrasing. DO NOT remove URLs/Links. DO NOT remove details (e.g. 'with someone'). DO NOT add a period at the end."
      Tags:
        type: "multi_select"
        instruction: "Select relevant tags (Travel, Skills, Adventure, etc)."

  places:
    description: "A Google Maps URL representing a place to visit or remember. The user context provides status/notes. STRICT RULE: The input MUST contain a valid Google Maps URL. If the user just describes a place in text without a link, do NOT use this category."
    properties:
      Name:
        type: "title"
        required: true
        instruction: "Use the official name from the Google Maps data"
      Status:
        type: "status"
        required: true
        allowlist: ["Haven't Been", "Priority", "Been"]
        instruction: |
          Determine status based on user intent:
          - "Priority": If the user expresses urgency (e.g. "must go", "dying to try", "need to visit").
          - "Been": If the user implies they have already visited (e.g. "went to", "visited", "was at").
          - "Haven't Been": (DEFAULT) For general bookmarks or future plans.
      # https://developers.google.com/maps/documentation/places/web-service/legacy/supported_types
      Tags:
        type: "multi_select"
        required: false
        instruction: |
          Analyze the 'Raw Types' list from the Google Maps data and map them to the Notion Tags below.
          Use this mapping guide:

          - "Accomodation": campground, lodging
          - "Bar": bar, liquor_store
          - "Club": night_club
          - "Cafe": cafe
          - "Bakery": bakery
          - "Restuarant": restaurant, meal_takeaway, meal_delivery
          - "Park": park
          - "Sightseeing": tourist_attraction, city_hall, cemetery, embassy, local_government_office, point_of_interest
          - "Museum": museum, art_gallery
          - "Place of Worship": church, hindu_temple, mosque, synagogue, place_of_worship
          - "Shopping": shopping_mall, clothing_store, department_store, store, electronics_store, home_goods_store, book_store, car_dealer, drugstore, furniture_store, hardware_store, jewelry_store, pet_store, shoe_store
          - "Concert Venu": stadium
          - "Activity": bowling_alley, casino, spa, movie_theater, beauty_salon, amusement_park, rv_park, zoo, aquarium
          - "Transit": airport, transit_station, subway_station, bus_station, train_station, light_rail_station, taxi_stand
          - "Parking": parking
          - "Study Spot": If the user mentions this is a good study spot
          - "Service": bank, atm, hospital, doctor, police, post_office, real_estate_agency, hair_care, laundry, gas_station, accounting, car_rental, car_repair, car_wash, courthouse, dentist, electrician, fire_station, funeral_home, insurance_agency, lawyer, locksmith, moving_company, painter, physiotherapist, plumber, roofing_contractor, storage, travel_agency, veterinary_care, pharmacy, florist, bicycle_store, grocery_or_supermarket, supermarket, convenience_store, gym
          - "View": If the user mentions "good view" or "scenic".

          Not tag at all: If the google maps type is one of the following, you may leave this field empty; however, if the google maps type is one of the following in addition to something else that matches the type, you can choose the other tag if that tag is better. Also, :if the user mentions one of the tags that doesn't have a google maps type associated with it and the google maps type is one of the following, you may select that tag. Here are the google maps types: university, library, school, primary_school, secondary_school, movie_rental

          *If a place matches multiple (e.g. a Cafe inside a Museum), select BOTH tags.*

          Finally, if the user context is very specific about the type of place (e.g. "great cafe spot"), PRIORITIZE that over the google maps types.
      Address:
        type: "rich_text"
        required: true
        instruction: "The formatted address from Google Maps."
      City:
        type: "select"
        required: true
        create_new: true
        instruction: "The city/locality component from the Google Maps address."
      Country:
        type: "select"
        required: true
        create_new: true
        instruction: "The country component from the Google Maps address."
      Notes:
        type: "rich_text"
        required: false
        instruction: "Extract user commentary that is NOT part of the address or name (e.g. '$10 cover', 'Best ceviche', 'Ask for the corner table')."
      Google Maps URL:
        type: "url"
        instruction: "The official Google Maps link of the place."
      Linked Trip:
        type: "relation"
        required: false
        instruction: |
          Review the 'AVAILABLE TRIPS' list provided in the context.
          1. TRIGGER: Only attempt this if the user explicitly mentions a trip (e.g. "for my Cabo trip", "LA trip", "Japan 2025").
          2. MATCHING: Find the best match from the list.
             - If user says "LA Trip" and list has "LA to Visit Derek", select "LA to Visit Derek".
             - If multiple matches exist (e.g. "NYC 2024", "NYC 2025"), select the one with the most recent or future date.
          3. OUTPUT: Return the EXACT Name of the trip from the list. If no match or no trip mentioned, return null.

  # Helpers
  youtube-channels:
    description: "Internal use."
    properties:
      Name:
        type: "title"

  logs:
    description: "Internal use."
    properties:
      Raw Input:
        type: "title"
      Code Execution:
        type: "status"
      Category:
        type: "select"
      Reported:
        type: "checkbox"
      Error Details:
        type: "rich_text"
      AI Summary:
        type: "rich_text"
      Created Item:
        type: "url"
  trips:
    description: "Internal inventory of trips."
    properties:
      Name:
        type: "title"
      Dates:
        type: "date"