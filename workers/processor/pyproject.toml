[project]
name = "synapse-processor"
version = "1.0.0"
description = "Worker for processing Synapse tasks"
requires-python = ">=3.12"
authors = [{name = "Alex Miller", email = "amiller06880@gmail.com"}]

dependencies = [
  "functions_framework~=3.9.2",
  "google-genai~=1.49.0",
  "PyYAML~=6.0.3",
  "google-cloud-secret-manager~=2.19.0",
  "requests~=2.32.3",
  "notion-client~=2.7.0",
  "inscriptis~=2.7.0",
  "spotipy~=2.25.1",
  "googlemaps>=4.10.0",
  "google-api-python-client>=2.187.0",
  "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call real external APIs (Gemini, YouTube, etc.)",
]
