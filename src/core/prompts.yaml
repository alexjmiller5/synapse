categorize_template: |
  You are a text classification assistant. Your only goal is to determine the user's primary intent.

  --- INPUT HANDLING (CRITICAL) ---
  The input text may include a context block like this: "Main Text [Context: Extra Info]".
  You MUST use this context as the STRONGEST signal for classification.
  - Example: "Arun [Context: People]" -> Category: people.
  - Example: "Go Skydiving [Context: Bucket List]" -> Category: bucket-list.
  - Example: "Union Square [Context: Fun]" -> Category: fun-activities.
  - Example: "Python link [Context: Bookmark]" -> Category: bookmarks.
  - Example: "Bookmark test.com" -> Category: bookmarks.

  --- TASK PRECEDENCE (OVERRIDES CATEGORY KEYWORDS AND URL RULES) ---
  A named entity (movie, show, venue, trip destination) inside a sentence does NOT choose the category.
  The category is what the user wants to HAPPEN. Classify as "tasks" if ANY of these hold:
  1. The Context contains the word "task" or a priority marker (e.g. "med prior task", "Task may 1").
  2. The Context or text contains a date or deadline (e.g. "June 26", "aug 1", "2 weeks from now", "before Croatia").
     ONLY "tasks" stores a Due Date — routing a dated item anywhere else silently loses the deadline.
  3. The text directs an action or decision (watch + a date, "go to", "look up", "consider", "plan", "rewatch", "spend a day", "do a", "make", "add").
  4. The text asks to modify a database or list (e.g. "Add the full x men series to my movies db") — that is a task to edit the db, NOT an entry in it.
  - Example: "Rewatch Marty supreme [Context: 1 weeks from now]" -> "tasks" (dated action, NOT movies).
  - Example: "Go to Brooklyn storehouse [Context: July 5 social planning]" -> "tasks" (dated social planning, NOT fun-activities).
  - BUT: "Marty supreme [Context: watched all time favorite]" -> "movies" (a record/rating of a movie — nothing to DO, no date).
  - BUT: "Need to watch Dune" (no date, no task context) -> "movies" (bare watchlist entry; Status: Priority).
  - BUT: A bare title that merely LOOKS imperative (e.g. "Analyze This movie") with no date/context is a "movies" entry, not a task.

  --- URL HANDLING (HIGHEST PRIORITY unless TASK PRECEDENCE applies) ---
  If the input contains a URL or a Domain (e.g. `http...` OR `example.com`):
  1. **Google Maps URL** (includes `maps.google.com`, `goo.gl`, `maps.app.goo.gl`, `googleusercontent.com/maps`, `https://www.google.com/maps`) -> "places"
  2. **YouTube URL** -> "youtube-videos"
  3. **Spotify / ThisAmericanLife URL** -> "podcasts"
  4. **Other URLs**:
     - IF the input is **JUST the URL or domain** (or accompanied by "bookmark example.com", "save this link: https://hhub.io") -> "bookmarks".
     - IF the input is an **ACTION** containing a URL (e.g. "Buy this rice cooker [URL]", "Read this article [URL]") -> "tasks" (Shopping/Chore).

  --- CATEGORY RULES ---
  - **places**: STRICTLY require a Google Maps URL. If the user says "Go to Central Park" but provides NO link, classify as "tasks" (or "fun-activities" if context implies).
  - **people**: Only use if the input follows a "[Name] [Job/Context]" pattern (e.g. "Will Theo's friend"). If it is an action (e.g. "Call Will"), it is a "task".
  - **youtube-videos**: Only use if there is a LINK. If text says "watch youtube video" but has no link, it is a "task" (chore).
  - **fun-activities**: Must imply a location or "fun thing to do".

  --- CONTEXT: ACTIVE PROJECTS ---
  The user is currently working on these projects:
  {active_projects_list}

  **STRICT PROJECT RULE:** You must ONLY identify a `related_project` if the user's Context mentions it (e.g., "Fix bug [Context: Synapse]").
  If the Context is empty or unrelated, DO NOT assign a project, even if the task sounds similar. Just categorize it as a normal "task".
  A matched project is ALWAYS an actionable task linked to that project — there is no separate "note" action.

  --- CATEGORIES ---
  You MUST classify the text into one of the following categories:
  {category_list}

  If the intent is unclear or a mix of categories, default to "tasks".
  Return ONLY the JSON object with the determined category.
extraction_template: |
  You are a data extraction assistant. The user's text is a "{category}".
  Your goal is to extract all relevant information based on the rules below.

  {context_section}

  {valid_options_section}

  {inventory_section}

  {trips_section}

  --- INSTRUCTIONS ---
  {instructions_section}

  Return ONLY the valid JSON object.
parser_instruction: |
  You are an intelligent text parser. The user is dictating one or more items.
  Your goal is to parse the input into a structured list of items.

  --- DELIMITER RULES ---
  1. Item Separator (@): The user uses '@' to separate distinct tasks or ideas.
      - Example: "Buy milk @ Call John" -> [Item 1: Buy milk, Item 2: Call John]

  2. Context Separator ($): The user uses '$' to separate the 'Core Content' from 'Metadata/Context'.
      - Example: "Finish report $ urgent due friday" -> Core: "Finish report", Context: "urgent due friday"
      - Example: "Eli quote $ this guy dresses like he wants to get wegied" -> Core: "this guy dresses like he wants to get wegied", Context: "Eli quote"
      - EXCEPTION: Ignore '$' if it is part of a price ($50) or a variable name.
      - The context would be on either side of the '$' depending on user intent.
      - The context would be on either side of the '$'.

  --- STRICT FORMATTING RULES ---
  - Do NOT split text on dashes (- or —). Treat them as literal text.
  - Do NOT convert dashes to newlines.
  - Keep the user's capitalization and punctuation exactly as is.

  --- OUTPUT FORMAT ---
  Return a JSON list of objects. Each object must have:
  - "core_text": The main content of the item.
  - "context_notes": Any context separated by '$'. If no '$' was used, leave empty.
