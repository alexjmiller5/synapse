# The product's interpretation layer: how Synapse reads text into Soma rows.
#
# Soma's catalog ENFORCES each column (type, required, select options and their
# meanings, defaults, invariants) and is fetched at run time (core/catalog.py).
# This file only INTERPRETS: classification precedence, which table and columns
# a category writes, and per-field phrasing. A field's `allowlist` narrows the
# catalog's options to the values Synapse may choose (values the catalog lacks
# are dropped); `required: true` makes the extractor always answer a field the
# catalog leaves optional. A workspace overlay may reword any of it.

categorize_template: |
  You are a text classification assistant. Determine the user's primary intent and
  return ONLY the JSON object with the chosen category.

  ## Hard rules
  Apply in PRECEDENCE ORDER — an earlier rule overrides a later one.
  1. CONTEXT is the strongest signal. The input may include a context block —
     "Main Text [Context: Extra Info]" — and you MUST weight it above everything else.
  2. TASK PRECEDENCE (overrides category keywords and URL rules). A named entity
     (movie, show, venue, trip destination) inside a sentence does NOT choose the
     category — the category is what the user wants to HAPPEN. Classify as "tasks" if
     ANY hold:
       a. The Context contains "task" or a priority marker ("med prior task", "Task may 1").
       b. The Context or text contains a date/deadline ("June 26", "aug 1", "2 weeks
          from now", "before Croatia"). ONLY "tasks" stores a Due Date — routing a
          dated item elsewhere silently loses the deadline.
       c. The text directs an action or decision (watch + a date, "go to", "look up",
          "consider", "plan", "rewatch", "spend a day", "do a", "make", "add").
       d. The text asks to modify a database or list ("Add the full x men series to my
          movies db") — that is a task to EDIT the db, not an entry in it.
  3. URL HANDLING (highest priority UNLESS task precedence applies). If the input
     contains a URL or domain (`http...` or `example.com`):
       a. YouTube URL -> "youtube-videos".
       b. Spotify / ThisAmericanLife URL -> "podcasts".
       c. Other URLs: just the URL/domain (or "bookmark example.com", "save this link:
          https://hhub.io") -> "bookmarks"; a URL inside an ACTION ("Buy this rice
          cooker [URL]", "Read this article [URL]") -> "tasks".
  4. CATEGORY REQUIREMENTS (strict):
       - youtube-videos: only with a LINK. "watch youtube video" with no link -> "task".
       - fun-activities: must imply a location or a "fun thing to do".
  5. PROJECT RULE (strict): only set a `related_project` if the Context names it
     ("Fix bug [Context: Synapse]") or the text/context carries the keyword `pj`
     (then it IS a project task: pick the best-matching active project). Otherwise
     an empty/unrelated context -> no project, just a normal "task". A matched project is ALWAYS an actionable task linked to it —
     there is no separate "note" action.
  6. Classify into exactly one of these categories:
     {category_list}

  ## Sentiments
  - When the intent is unclear or a mix of categories, default to "tasks".
  - A bare title that merely LOOKS imperative ("Analyze This movie") with no
    date/context is a record ("movies"), not a task.

  ## Active projects (context)
  The user is currently working on these projects:
  {active_projects_list}

  ## Examples
  - `Go Skydiving [Context: Bucket List]` -> bucket-list
  - `Union Square [Context: Fun]` -> fun-activities
  - `Python link [Context: Bookmark]` -> bookmarks
  - `Bookmark test.com` -> bookmarks
  - `Rewatch Marty supreme [Context: 1 weeks from now]` -> tasks (dated action, NOT movies)
  - `Go to Brooklyn storehouse [Context: July 5 social planning]` -> tasks (dated planning)
  - `Marty supreme [Context: watched all time favorite]` -> movies (a record/rating; nothing to DO)
  - `Need to watch Dune` -> movies (bare watchlist entry; Status: Priority)
  - `Analyze This movie` -> movies (bare title, no date/context)
extraction_template: |
  You are a data extraction assistant. The user's text is a "{category}". Extract all
  relevant information per the rules below and return ONLY the valid JSON object.

  {context_section}

  {valid_options_section}

  {inventory_section}

  {rules_section}

  ## Hard rules
  {instructions_section}
parser_instruction: |
  You are an intelligent text parser. Split the user's dictation into a structured
  list of items.

  ## Hard rules
  1. Item separator '@': split distinct items on '@'.
  2. Context separator '$': split the 'core_text' from the 'context_notes' on '$'. The
     context may sit on EITHER side of the '$' depending on intent. Ignore a '$' that
     is part of a price ($50) or a variable name.
  3. Never split on dashes (- or —) — treat them as literal text; never convert them
     to newlines.
  4. Keep the user's capitalization and punctuation exactly as is.

  ## Sentiments
  - If no '$' is present, leave context_notes empty.

  ## Examples
  - `Buy milk @ Call John` -> [{core_text: "Buy milk"}, {core_text: "Call John"}]
  - `Finish report $ urgent due friday` -> [{core_text: "Finish report", context_notes: "urgent due friday"}]
  - `notion finance sync proj $ add a webhook to trigger a sync` -> [{core_text: "add a webhook to trigger a sync", context_notes: "notion finance sync proj"}]  # a short project/label is context; the actionable content is core, regardless of side

  ## Output format
  Return a JSON list of objects. Each object must have "core_text" (the main content)
  and "context_notes" (context separated by '$', else empty).

categories:
  tasks:
    # Table and columns: the workspace's workflow.tasks binding.
    description: "A general to-do item, reminder, or action — anything the user must DO, decide, or schedule, even when it names a movie, show, venue, or trip. This is the ONLY category that stores a Due Date, so anything with a date/deadline belongs here."
    place_tags: []
    properties:
      Name:
        required: true
        instruction: "This MUST be the user's original, unmodified text."
      Tags:
        required: true
        allowlist: ["Gifts", "Shopping", "Work", "Social Planning", "Finances", "Career", "Chore", "Errand", "Decision", "Learning"]
        instruction: |
          Select the most specific tag using the user's definitions. ONLY SELECT ONE. EVEN IF THOUGH THIS IS A MULTISELECT PROPERTY, I ONLY WANT YOU TO TREAT IT AS A SELECT AND SELECT ONE OF THE TAGS. FOLLOW THIS PRIORITY to avoid misclassification:
          0. PLACE TAGS {place_tags}: if the Context or text names one of these places, ALWAYS use that place's tag — it wins over every rule below. These mark tasks to do when the user is next AT that place.
          1. "Chore": (DEFAULT) As the user says, "Most tasks are chores to be honest." If it's something quick to do on the computer, in the room, updating a playlist (e.g. Karaoke), editing a profile (dating app), or fixing a technical sync issue, IT IS A CHORE. A task belonging to one of the user's personal coding projects (e.g. the Context names a project) is ALWAYS a Chore no matter what its subject matter sounds like — a scraper for airline points built for a coding project is a Chore, NOT "Finances".
          2. "Errand": Whatever involves going out of the house to do it (e.g. picking up dry cleaning, dropping something off at Goodwill).
          3. "Work": RARE. ONLY for the user's actual employer / employed job (or PTO from that job). The user's PERSONAL side projects and coding projects are NOT Work — e.g. a personal app, a side project, or fixing up their notes system. A task for a personal coding/side project is a CHORE, not Work (its computer-based nature makes it a Chore per rule 1). "Work" is strictly the user's employed job.
          4. "Shopping": Anything related to buying (Amazon, etc). Use "Gifts" if it's a gift idea or buying for someone else.
          5. "Learning": "Something to explore"—like looking through a website, looking into a tool, or figuring out how something works (e.g. "how the python tool uv works").
          6. "Career": General career stuff (job search, interviews, resume, networking — not day-to-day work tasks).
          7. "Social Planning": ONLY if actually scheduling a specific event with other people. Even if it involves interaction with others that doesn't necesarily mean it has this tag -- for this tag it MUST be specifically for me to plan some kind of social event with others. If I have to ask someone something or talk to them about something that's not social planning. Updating a bucket list or profile solo is a CHORE.
      Priority:
        allowlist: ["Low", "Medium", "High"]
        instruction: |
          The default for this cateogry if the user doesn't specify a priority is High. If the user mentions Low or Medium priority, then make the task as such. Oftentimes the user will just say "low" or "medium", they won't necesarily say "low priority". You should interespret just the mention of low or medium as meaning the corresponding priority, and the same for high priority. And again, if the user doesn't specify high priority, then you should default to High.
      Links:
        instruction: "Every valid URL (http, https) in the text, one per line. Leave empty when there is none."
      Due Date:
        required: true
        instruction: |
          Determine the due date using this priority order:
          1. CHECK CONTEXT: If the user provided a date in the Context/Metadata block (e.g. "January 2025", "next week"), USE THAT DATE.
          2. CHECK TEXT: If no date is in the Context, look for date mentions in the text itself.
          3. FALLBACK: If absolutely no date is found in either, use today: {current_date}.
          Write it as an ISO 8601 date (YYYY-MM-DD).
          *Note: EXCEPTION — if you selected a place tag from {place_tags} for Tags and no date is mentioned in the text or Context, output "" (empty string) instead of the fallback: place-tagged tasks are dateless by design.*
          *Note: If the user gives a vague date like "January 2025", assume the 1st of that month.*
          *Note: If the user gives a month and day but no year (e.g. "March 5"), assume the next occurrence of that date (e.g. if today is June 2024, "March 5" means March 5, 2025). IF IT'S CURRENTLY DEC 2025 AND THE USER CONTEXT SAYS 'Nov 14' THE USER MEANS Nov 14, 2026.*
          *Note: A BARE MONTH NAME with no day (e.g. "September") means the 1st of the NEXT occurrence of that month relative to today ({current_date}): use this year if that month is still upcoming, otherwise next year. NEVER default a bare month to January — e.g. if today is 2026-07-07, "September" means 2026-09-01, and "March" means 2027-03-01.*

  groceries:
    # A capture that matches an existing name updates that row.
    table: groceries
    match_on: name
    columns: { Name: name, Category: category, Status: status }
    description: "A food item or household consumable (ONLY food/drink. Non-food items go to Shopping). Sometimes if a food is included, but the prompt is very specific, it will be a task. For example 'Buy a 10 pound bag of rice if the 2 pound is too small`` is a task because of the specific instructions. But 'Buy rice' is groceries."
    properties:
      Name:
        instruction: "Check the 'EXISTING INVENTORY' list provided. If the user's item matches (or is a close variation of) an existing item name, USE THE EXISTING EXACT NAME. If it is truly new, create a singular, Title Case name."
      Category: {}
      Status:
        allowlist: ["On List", "Don't Have", "Have"]
        instruction: "Determine status based on text (e.g. 'need'/'buy' -> 'On List', 'out of'/'empty' -> 'Don't Have', 'got'/'bought' -> 'Have')."

  ideas:
    table: ideas
    columns: { Description: description, Tags: tags, Status: status }
    description: "A random thought, invention idea, app concept, or project idea. Specifically has to have the word idea in it. The user will specify that this is an idea they just had, most of thoughts are tasks. These are likes ideas for a business, idea for a tv show -- something to create. NOT an idea for a gift for somebody or something like that. Usually this has the word idea in it, but sometimes it does. For example, if the user input is 'Idea for a name: call it quick test (Context: mcat availability project)', the context is clearly specifying that this is an idea for a name a related project, not a standalone idea. Standalone ideas for this categorization won't usually have any context unless it's specifying the status of the idea or that it's an idea. The context might just be 'new idea' or 'great idea' or something like that but wouldn't specify a specific project - if it did specify a project it would be a task related to that project, not an idea."
    properties:
      Description:
        instruction: "The user's full original text."
      Tags:
        instruction: "Select relevant tags from the list. Add 'Hobby' when the user calls it a hobby idea, something to do for fun, or says it has no business case (keep the domain tags too)."
      Status:
        allowlist: ["Someday", "Priority"]
        instruction: "Use Priority only if the user says it is a good/great idea or otherwise signals they want to pursue it."

  movies:
    # The TMDB id is the row id; the hub derives title, year, genres and cast from it.
    table: movies
    description: "A movie title, genre, or film description to watch or rate. A bare 'need to watch X' with NO date is a movie (Status: Priority). But if there is a date/deadline, a 'task' context, or a request to edit the movies db (e.g. 'add X to my movies db'), it is a task, not a movie."
    saved_column: null
    capture_columns: { Status: status, Tags: tags, Date Watched: date_watched, Notes: note }
    properties:
      Capture Intent:
        allowlist: ["save", "record_consumption", "none"]
        instruction: "save only for an explicit wish to watch or save for later; record_consumption for a report of watching or completion; none otherwise. A past-tense report is not a save."
      Date Watched:
        instruction: "Only a consumption date explicitly supplied by the user. Leave empty when unspecified."
      Notes:
        instruction: "Only notes explicitly requested by the user; leave empty otherwise."
      Title:
        required: true
        instruction: "The official movie title, EXACTLY as TMDB lists it, so an automated metadata lookup finds the right film. Try to extract from the user text if necessary -- like if user says 'led zeppelin documentary' the title is 'Becoming Led Zeppelin'. Fix any typos, capitalization, or missing punctuation (e.g. 'the avengers' -> 'The Avengers'), DO NOT include the word 'movie' or 'film' unless it is part of the official name (e.g., 'The Lego Movie'). DISAMBIGUATE REMAKES: if the user clearly means a specific remake/version of a title with multiple films, append the release year in parentheses -> 'Ghostbusters (2016)'. Leave a bare title (no year) when they mean the original/most well-known version (e.g. 'Ghostbusters' = the 1984 original)."
      Tags:
        instruction: "If the user says the movie is a favorite, an 'all time favorite' or one of the best movies, add the 'Favorite' tag (there is ONE favorite tier). Add 'Sequel' or 'Prequel' only when the user says so. Add 'Studio Ghibli' if the user says so OR if you know it is a Studio Ghibli film even when they don't say it. Add a curated tag only when the user's words or a fact you are sure of calls for it -- these are the user's own labels, NOT genres (genres are filled in automatically). Leave empty if none applies."
      Status:
        instruction: |
          Determine the status based on the user's specific phrasing. FOLLOW THIS ORDER:
          1. "Priority": If the user says "need to watch", "must watch", "priority movie", "priority", "dying to see", "really want to see", or uses exclamation marks. NOT JUST if they say "watch [movie]" - THAT IS "Not Started".
          2. "Finished": If the user says "watched", "seen", "finished", "completed", or gives a review/rating. (There is no separate "Watched" status — a watched movie is "Finished".)
          3. "In Progress": If the user says "watching", "started", or "currently on".
          4. "Watched Parts": If they mention having watched parts/some of it.
          5. "Gave Up": If the user stopped watching or disliked it.
          6. Leave Status empty unless the user explicitly requests a status. A neutral title or save-for-later request must not reset an existing status.

  tv-shows:
    # See movies.
    table: tv_shows
    description: "A TV series title to start or track status of."
    saved_column: null
    capture_columns: { Status: status, Tags: tags, Date Watched: date_watched, Notes: note }
    properties:
      Capture Intent:
        allowlist: ["save", "record_consumption", "none"]
        instruction: "save only for an explicit wish to watch or save for later; record_consumption for a report of watching or completion; none otherwise. A past-tense report is not a save."
      Date Watched:
        instruction: "Only a consumption date explicitly supplied by the user. Leave empty when unspecified."
      Notes:
        instruction: "Only notes explicitly requested by the user; leave empty otherwise."
      Title:
        required: true
        instruction: "The official TV show title, EXACTLY as TMDB lists it, so an automated metadata lookup finds the right show. Try to extract from the user text if necessary -- like if user says 'billy joel series' the title is 'Billy Joel: And So It Goes'. Fix any typos, capitalization, or missing punctuation (e.g. 'love is blnd habibi' -> 'Love Is Blind: Habibi'), DO NOT include the word 'show', 'series', or 'season' unless it is actually part of the official name (e.g., 'The Morning Show' is okay, but 'Pluribus Show' should just be 'Pluribus'). If the user clearly means a specific remake/version of a title with multiple shows, append the release year in parentheses to disambiguate."
      Tags:
        instruction: "Add 'Favorite' if the user says the show is a favorite or an all-time favorite (there is ONE favorite tier). Add 'Sequel' or 'Prequel' only when the user says so. Add a curated tag only when the user's words or a fact you are sure of calls for it -- these are the user's own labels, NOT genres (genres are filled in automatically). Leave empty if none applies."
      Status:
        instruction: |
          Determine the status based on the user's specific phrasing. FOLLOW THIS ORDER:
          1. "Priority": If the user says "need to watch", "must watch", "priority", "dying to see", "really want to see", or uses exclamation marks. NOT JUST if they say "watch [title]" - THAT IS "Not Started".
          2. "Finished": If the user says "watched", "seen", "finished", "completed", or gives a review/rating.
          3. "In Progress": If the user says "watching", "started", or "currently on".
          4. "Gave Up": If the user stopped watching or disliked it.
          5. "Watched Parts": If they mention having watched parts/some episodes of it.
          6. Leave Status empty unless the user explicitly requests a status. A neutral title or save-for-later request must not reset an existing status.

  podcasts:
    # Manually curated episodes (podcasts are not a Media Center source).
    table: podcast_episodes
    columns: { "Episode Title": title, "Podcast Name": podcast, Producer: producer, Genres: genres, Status: status, URL: url, "Date Listened To": date_listened }
    saved_column: null
    capture_columns: { Status: status, Date Listened To: date_listened, Notes: note }
    description: "A podcast episode or series (MUST contains a Spotify or 'thisamericanlife.org' link). If the user just describes a podcast without a link, classify as a TASK (Chore). Or if they say add these podcasts to my db for example, that is also a task."
    properties:
      Capture Intent:
        allowlist: ["save", "record_consumption", "none"]
        instruction: "save only for an explicit save-for-later request; record_consumption for a listening report; none otherwise."
      Notes:
        instruction: "Only notes explicitly requested by the user."
      Episode Title:
        instruction: "The specific episode title."
      Podcast Name:
        instruction: "The name of the show."
      Producer:
        instruction: "The network/producer."
      Genres:
        instruction: "Relevant genres."
      Status:
        allowlist: ["Priority", "Not Started", "In Progress", "Finished"]
        instruction: "Finished if listened, In Progress if listening, Priority if the user says they must/need to listen. Leave empty when the user did not specify consumption state."
      URL:
        instruction: "The valid URL found in the text."

  youtube-videos:
    # The YouTube video id is the row id; title, channel and duration come from the YouTube API.
    table: youtube_videos
    description: "A YouTube video. MUST contain a valid 'youtube.com' or 'youtu.be' or m.youtube.com link. If the user just describes a video without a link, classify as a TASK (Chore)."
    saved_column: null
    capture_columns: { Status: status, Tags: tags, Date Watched: date_watched, Notes: note }
    properties:
      Capture Intent:
        allowlist: ["save", "record_consumption", "none"]
        instruction: "save only for an explicit wish to watch or save for later; record_consumption for a report of watching or completion; none otherwise. A past-tense report is not a save."
      Date Watched:
        instruction: "Only a consumption date explicitly supplied by the user. Leave empty when unspecified."
      Notes:
        instruction: "Only notes explicitly requested by the user; leave empty otherwise."
      Video URL:
        required: true
        instruction: "The valid YouTube URL. If missing, this is invalid."
      Status:
        instruction: |
          Determine the status based on the user's specific phrasing. FOLLOW THIS ORDER:
          1. "Priority": If the user says "need to watch", "must watch", "priority", "dying to watch", "really want to see", or uses exclamation marks. NOT JUST if they say "watch [video]" - THAT IS "Not Started".
          2. "Finished": If the user says "watched", "seen", "finished", "completed", or gives a review/rating.
          3. "In Progress": If the user says "watching", "started", or "currently on".
          4. "Watched Parts": If they mention having watched parts/some of it.
          5. "Gave Up": If the user stopped watching or disliked it.
          6. Leave Status empty unless the user explicitly requests a status. A neutral title or save-for-later request must not reset an existing status.
      Tags:
        instruction: "Select 'Favorite' if the user praises it highly. Select 'Classic' if implied."

  fun-activities:
    # things_to_do rows of kind Activity (repeatable outings).
    table: things_to_do
    constants: { kind: "Activity" }
    columns: { Title: title, Location: city, Tags: tags, Status: status }
    review_if_missing: { Location: "City could not be inferred from the capture." }
    description: "A fun activity, event, or place to visit — an UNDATED wishlist entry only. User usually specifies a location or implies 'fun thing to do'. If there is a date, a social-planning context, or the user is still deciding/planning (e.g. 'consider going to gov ball'), it is a task."
    properties:
      Title:
        instruction: "The specific name of the activity or place (e.g. 'Walk around Union Square', 'Visit Seaport')."
      Location:
        instruction: "Infer the city from the text and its landmarks (e.g. Union Square, Central Park or Brooklyn mean NYC). If the location is totally ambiguous, leave empty (the row is flagged for review)."
      Tags:
        allowlist: ["Show", "Nightlife", "Cultural", "Social", "Food"]
        instruction: "Select relevant tags (Food, Nightlife, Social, Cultural, Show). Use 'Food' for restaurants, 'Nightlife' for bars/clubs. Isn't necessary if an item doesn't fit any of these categories or if you're unsue -- it's okay to leave empty. Also cultural really ahs to mean cultural - The Edge in nyc is more of a touristy cool thing but it's not cultural"
      Status:
        allowlist: ["Someday", "Planned", "Completed"]
        instruction: "Use 'Planned' if the user has a concrete plan or date, 'Completed' if the user implies they already did it."

  bookmarks:
    # One bookmark per url: a capture of a known url updates it.
    table: bookmarks
    match_on: url
    columns: { Description: description, Title: title, URL: url, Tags: tags }
    # The pipeline drops Title when the page could not be fetched.
    review_if_missing: { Title: "Page could not be fetched; title is empty and description was guessed from the URL" }
    description: "A web bookmark. Triggers if input is a URL (that is NOT YouTube, Spotify, 'thisamericanlife.org', or Google Maps URL). If there is more context than just the url, this should NOT be categorized as a bookmarks - bookmarks are ONLY urls. For example, if the user input is 'Check out this website: www.test.com for more info', that is a task (chore) to check out the website, not a bookmark. Bookmarks are ONLY when the user input is JUST a url or something very close to just a url with minimal extra text."
    properties:
      Description:
        instruction: |
          This is the Summary property. Write a short summary of what the website is about.
          - If it's a GitHub link, use the repo description exactly as is.
          - Otherwise, " Write a short 1-2 sentence description of what the website is about (based on the page content preview)."
      Title:
        required: true
        instruction: "The actual HTML Title of the webpage (from metadata) or the website name.This is the Page Name property. Fill this with the exact 'HTML Title' extracted from the webpage metadata (e.g. 'Socket - Secure your dependencies...'). Do NOT write a summary here."
      URL:
        required: true
        instruction: "The URL. If the user provides a domain without a protocol (e.g. 'test.com' or 'www.google.com'), you MUST prepend 'https://' to ensure it is a valid link."
      Tags:
        instruction: "Select every tag that fits, using the tag meanings above. Always select 'Github' when the URL contains github.com. Leave a tag out unless the page clearly matches its meaning."

  bucket-list:
    # things_to_do rows of kind Ambition (one-off goals).
    table: things_to_do
    constants: { kind: "Ambition" }
    columns: { Item: title, Tags: tags }
    description: "Items to do before dying. Context usually contains 'bucket list'."
    properties:
      Item:
        instruction: "The specific item to do. Use the user's original phrasing. DO NOT remove URLs/Links. DO NOT remove details (e.g. 'with someone'). DO NOT add a period at the end."
      Tags:
        allowlist: ["Adventure", "Altruism", "Concert", "Cooking", "Culture", "Drug", "Education", "Event", "Experience", "Fitness", "Food", "Fun", "Goals", "Learning", "Nature", "Personal", "Personal Care", "Skills", "Sports", "Technology", "Travel"]
        instruction: "Select relevant tags (Travel, Skills, Adventure, etc)."

  articles:
    table: articles
    saved_column: null
    columns: { Title: title }
    capture_columns: { Status: status, Date Read: date_read, Tags: tags, Notes: note }
    description: "An article the user explicitly wants to save for reading or reports reading. Must include its URL. General website bookmarks remain bookmarks."
    properties:
      Title:
        instruction: "Use the article title from fetched metadata or an explicitly supplied title. Never invent a title."
      URL:
        required: true
        instruction: "The exact article URL."
      Capture Intent:
        allowlist: ["save", "record_consumption", "none"]
        instruction: "save for an explicit save-for-later request, record_consumption for a reading report, none otherwise."
      Status:
        instruction: "Only consumption state explicitly conveyed by the user. Leave empty for a save request."
      Date Read:
        instruction: "Only a reading date explicitly supplied by the user."
      Tags:
        instruction: "Only tags explicitly requested by the user."
      Notes:
        instruction: "Only notes explicitly requested by the user."
