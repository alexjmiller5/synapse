name: Terraform Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yaml'
      - 'config.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yaml'
      - 'config.yaml'
  workflow_dispatch:

env:
  TF_VERSION: '~> 1.13.4'
  INFRASTRUCTURE_DIR: ./infrastructure

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Load config into deployment environment
      run: |
        yq e 'to_entries | .[] | select(.value | (tag != "!!map" and tag != "!!seq")) | .key + "=" + .value' config.yaml >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'terraform-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: Terraform Init
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: |
        terraform init \
          -backend-config="bucket=${{ env.gcp_project_id }}-terraform-state" \
          -backend-config="prefix=synapse"

    - name: Terraform Format Check
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: terraform validate -no-color

    - name: Terraform Plan
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: |
        terraform plan -out=tfplan

    - name: Terraform Apply
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: terraform apply -auto-approve tfplan