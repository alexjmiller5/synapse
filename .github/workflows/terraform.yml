name: Terraform Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
      - 'config.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
      - 'config.yml'
  workflow_dispatch:  # Allow manual triggering

env:
  TF_VERSION: '~> 1.13.4'
  INFRASTRUCTURE_DIR: ./infrastructure

jobs:
  terraform-apply:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Load Configuration from yml
      id: read_config
      run: |
        yq e 'to_entries | .[] | select(.value | (tag != "!!map" and tag != "!!seq")) | .key + "=" + .value' config.yml >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'terraform-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: Terraform Init
      id: tf-init
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: |
        terraform init \
          -backend-config="bucket=${{ env.gcp_project_id }}-terraform-state" \
          -backend-config="prefix=synapse"

    - name: Terraform Format Check
      id: tf-fmt
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: terraform fmt -check

    - name: Terraform Validate
      id: tf-validate
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: terraform validate -no-color

    - name: Terraform Plan
      id: tf-plan
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: |
        terraform plan \
          -var="project_id=${{ env.gcp_project_id }}" \
          -var="region=${{ env.region }}" \
          -var="github_repo=${{ env.github_repo }}" \
          -out=tfplan

    - name: Terraform Apply
      working-directory: ${{ env.INFRASTRUCTURE_DIR }}
      run: terraform apply -auto-approve tfplan