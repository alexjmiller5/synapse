name: Deploy Synapse Application

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "workers/**"
      - "pyproject.toml"
      - "uv.lock"
      - "config.yaml"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: intaker
            path: services/intaker
          - name: processor
            path: workers/processor
    defaults:
      run:
        working-directory: ${{ matrix.service.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install service + test dependencies
        run: uv sync --all-groups
        working-directory: .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            uv run --group dev pytest tests/ -v --cov --cov-report=term-missing
          else
            echo "No tests directory found for ${{ matrix.service.name }}, skipping."
          fi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: synapse-intaker
            path: services/intaker
            entry_point: intaker
            trigger_http: true
          - name: synapse-processor
            path: workers/processor
            entry_point: processor

    steps:
      - uses: actions/checkout@v5

      - name: Load config into deployment environment
        run: |
          yq e 'to_entries | .[] | select(.value | kind == "scalar") | .key + "=" + .value' config.yaml >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Generate requirements.txt
        run: |
            uv export \
              --frozen \
              --format requirements-txt \
              --no-hashes \
              --package "${{ matrix.service.name }}" \
              --output-file "${{ matrix.service.path }}/requirements.txt"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "deploy-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com"

      - name: Copy root config files to service directory
        run: |
          cp config.yaml "${{ matrix.service.path }}/config.yaml"
          cp .python-version "${{ matrix.service.path }}/.python-version"

      - name: Deploy ${{ matrix.service.name }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service.name }}
          region: ${{ env.region }}
          source: ${{ matrix.service.path }}
          env_vars: |
          flags: >-
            --function=${{ matrix.service.entry_point }}
            --no-allow-unauthenticated
