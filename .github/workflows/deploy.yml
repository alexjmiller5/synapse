name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: processor
            path: services/processor
          - name: reporter
            path: services/reporter
    defaults:
      run:
        working-directory: ${{ matrix.service.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install service + test deps
        run: |
          uv sync --frozen --all-extras

      - name: Run tests
        run: |
          echo "TODO: Implement tests!"  
        # uv run pytest tests/ -v --cov=src --cov-report=term-missing

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: processor
            path: services/processor
            entry_point: process
            trigger_http: true
          - name: reporter
            path: services/reporter
            entry_point: report
            trigger_topic: reporter

    steps:
      - uses: actions/checkout@v5

      - name: Load config
        run: |
          yq e 'to_entries | .[] | select(.value | type != "object" and type != "array") | .key + "=" + .value' config.yml >> $GITHUB_ENV

      - name: Generate requirements.txt
        run: |
          cd ${{ matrix.service.path }}
          
          # Install uv if not already available
          pip install uv
          
          if [ -f "pyproject.toml" ]; then
            echo "Exporting dependencies using uv..."
            
            # Use uv to export dependencies in requirements.txt format
            uv pip compile pyproject.toml -o requirements.txt --no-dev
            
            echo "Generated requirements.txt:"
            cat requirements.txt
          else
            echo "No pyproject.toml found, checking for existing requirements.txt..."
            if [ ! -f "requirements.txt" ]; then
              echo "❌ No dependency files found - deployment may fail"
              exit 1
            fi
          fi
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'deploy-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

      - name: Deploy ${{ matrix.service.name }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service.name }}
          region: ${{ env.region }}
          source: ${{ matrix.service.path }}
          env_vars: |
            GOOGLE_FUNCTION_TARGET=${{ matrix.service.entry_point }}
          flags: >-
            ${{ matrix.service.trigger_topic && 
                '--no-allow-unauthenticated' || 
                '--allow-unauthenticated' }}