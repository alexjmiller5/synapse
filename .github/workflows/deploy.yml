name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    - name: Install dependencies
      run: uv sync --dev
    - name: Run tests
      run: uv run pytest tests/ -v --cov=services

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        function:
          - name: 'synapse-ingestion'
            entry_point: 'ingestion_function'
            trigger_http: true
          - name: 'synapse-reporting'
            entry_point: 'reporting_function'
            trigger_topic: 'synapse-reporting'

    steps:
    - uses: actions/checkout@v5

    # - name: Load Configuration from yml
    #   id: read_config
    #   run: |
    #     echo "GCP_PROJECT_ID=$(yq e '.gcp_project_id' $config.yml)" >> $GITHUB_ENV
    #     echo "GCP_REGION=$(yq e '.region' $config.yml)" >> $GITHUB_ENV
    #     echo "GCP_REGION=$(yq e '.github-repo' $config.yml)" >> $GITHUB_ENV

    - name: Load Configuration from yml
      id: read_config
      run: |
        yq e 'to_entries | .[] | select(.value | (tag != "!!map" and tag != "!!seq")) | .key + "=" + .value' config.yml >> $GITHUB_ENV
    - name: 'Authenticate to Google Cloud'
      id: 'auth'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'deploy-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

    - name: 'Deploy ${{ matrix.function.name }}'
      id: 'deploy'
      uses: 'google-github-actions/deploy-cloud-functions@v4'
      with:
        name: ${{ matrix.function.name }}
        entry_point: ${{ matrix.function.entry_point }}
        region: ${{ env.GCP_REGION }}
        runtime: 'python312'
        source_dir: '.'

    - name: 'Update Deployment Summary'
      run: |
        # Write the header only on the first run of the matrix
        if [ ${{ strategy.job-index }} -eq 0 ]; then
          echo "## Deployment Successful! ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Function | Region | Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        fi

        # Determine the trigger type for the summary table
        TRIGGER_TYPE="HTTP"
        if [ -n "${{ matrix.function.trigger_topic }}" ]; then
          TRIGGER_TYPE="Pub/Sub (${{ matrix.function.trigger_topic }})"
        fi
        
        # Append a row for the currently deployed function
        echo "| **${{ matrix.function.name }}** | \`${{ env.GCP_REGION }}\` | ${TRIGGER_TYPE} |" >> $GITHUB_STEP_SUMMARY
        
        # If the function is HTTP-triggered, add its URL to the summary
        if [ "${{ matrix.function.trigger_http }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **${{ matrix.function.name }} URL:**" >> $GITHUB_STEP_SUMMARY
            echo "\`${{ steps.deploy.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
        fi