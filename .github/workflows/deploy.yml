name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Discover services from filesystem + pyproject.toml
  # ──────────────────────────────────────────────────────────────
  discover-services:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Discover services
        id: set-matrix
        run: |
          # Find all service dirs with pyproject.toml
          services=$(find services -maxdepth 2 -name pyproject.toml -exec dirname {} \; | sort)
          
          matrix_json=$(echo "$services" | jq -R . | jq -s 'map({
            name: (split("/")[-1]),
            path: .,
            # Extract entry_point from pyproject.toml [project.scripts] or metadata
            entry_point: (
              if test -f (./pyproject.toml) then
                . as $path
                | fromjson
                | .project.scripts // empty
                | to_entries[0].key
              else empty end
            ),
            # Default triggers — override in pyproject.toml if needed
            trigger_http: true,
            trigger_topic: null
          })')
          
          echo "matrix=$(echo "$matrix_json" | jq -c '{include: .}')" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # 2. Test each service in parallel
  # ──────────────────────────────────────────────────────────────
  test:
    needs: discover-services
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discover-services.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install workspace + service
        run: |
          uv sync --frozen --all-extras

      - name: Run tests
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=term-missing

  # ──────────────────────────────────────────────────────────────
  # 3. Deploy only on main
  # ──────────────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [discover-services, test]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discover-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Load config
        run: |
          yq e 'to_entries | .[] | select(.value | type != "object" and type != "array") | .key + "=" + .value' config.yml >> $GITHUB_ENV

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'deploy-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

      - name: Deploy ${{ matrix.name }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.name }}
          region: ${{ env.region }}
          source: ${{ matrix.path }}
          env_vars: |
            GOOGLE_FUNCTION_TARGET=${{ matrix.entry_point }}
          flags: >-
            ${{ matrix.trigger_topic && 
                format('--trigger-topic={0} --no-allow-unauthenticated', matrix.trigger_topic) || 
                '--allow-unauthenticated' }}