name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: processor
            path: services/processor
          - name: reporter
            path: services/reporter
    defaults:
      run:
        working-directory: ${{ matrix.service.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install service + test deps
        run: |
          uv sync --frozen --all-extras

      - name: Run tests
        run: |
          echo "TODO: Implement tests!"  
        # uv run pytest tests/ -v --cov=src --cov-report=term-missing

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: processor
            path: services/processor
            entry_point: process
            trigger_http: true
            api_spec_template: "api-gateways/processor-spec-template.yml"
          - name: reporter
            path: services/reporter
            entry_point: report
            trigger_topic: reporter
            api_spec_template: ""

    steps:
      - uses: actions/checkout@v5

      - name: Load config
        run: |
          yq e 'to_entries | .[] | select(.value | type != "object" and type != "array") | .key + "=" + .value' config.yml >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # TODO: change the export command to not use dev dependencies 
      # uv export --no-dev --format requirements-txt > requirements.txt
      - name: Generate requirements.txt
        run: |
          cd ${{ matrix.service.path }}
          
          if [ -f "pyproject.toml" ]; then
            echo "Exporting dependencies using uv..."
            
            # Use uv to export dependencies in requirements.txt format
            uv pip compile pyproject.toml -o requirements.txt
            echo "Generated requirements.txt:"
            cat requirements.txt
          else
            echo "No pyproject.toml found, checking for existing requirements.txt..."
            if [ ! -f "requirements.txt" ]; then
              echo "❌ No dependency files found - deployment may fail"
              exit 1
            fi
          fi
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'deploy-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

      - name: Deploy ${{ matrix.service.name }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service.name }}
          region: ${{ env.region }}
          source: ${{ matrix.service.path }}
          env_vars: |
            GOOGLE_FUNCTION_TARGET=${{ matrix.service.entry_point }}
          flags: >-
            --function=${{ matrix.service.entry_point }}
            ${{ matrix.service.trigger_topic && 
                '--no-allow-unauthenticated' || 
                '--no-allow-unauthenticated' }}

      - name: Get Cloud Run service URL
        id: get_url
        if: matrix.service.api_spec_template != ''
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ matrix.service.name }} \
            --region ${{ env.region }} \
            --format 'value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          
      - name: Deploy API Gateway
        if: matrix.service.api_spec_template != ''
        env:
          # This email must match the SA you created in Terraform
          GATEWAY_SA_EMAIL: "api-gateway-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com"
          API_ID: "processor-api"
          GATEWAY_ID: "processor-gateway"
          CONFIG_ID: "config-${{ github.run_id }}" # Create a unique config ID
        run: |
          echo "Deploying API Gateway for ${{ matrix.service.name }}..."
          
          # 1. Create the API (fails silently if it already exists)
          gcloud api-gateway apis create ${API_ID} \
            --project=${{ env.gcp_project_id }} || echo "API '${API_ID}' already exists."

          echo "Enabling the managed service for ${API_ID}..."
          SERVICE_NAME=$(gcloud api-gateway apis describe ${API_ID} \
            --project=${{ env.gcp_project_id }} \
            --format 'value(managedService)')
          
          gcloud services enable $SERVICE_NAME
          
          # 2. Prepare the spec file by replacing the DUMMY_URL
          echo "Replacing placeholder in spec..."
          sed "s|DUMMY_URL|${{ steps.get_url.outputs.service_url }}|g" \
            ${{ matrix.service.api_spec_template }} > processed-spec.yml

          echo "--- Processed Spec---"
          cat processed-spec.yml
          echo "---------------------"

          # 3. Create the new API Config
          gcloud api-gateway api-configs create ${CONFIG_ID} \
            --api=${API_ID} \
            --project=${{ env.gcp_project_id }} \
            --openapi-spec=processed-spec.yml \
            --backend-auth-service-account=${GATEWAY_SA_EMAIL}

          # 4. Create or Update the Gateway to use the new config
          # This command creates the gateway if it's missing,
          # or updates it to the new config if it exists.
          gcloud api-gateway gateways create ${GATEWAY_ID} \
            --api=${API_ID} \
            --api-config=${CONFIG_ID} \
            --location=${{ env.region }} \
            --project=${{ env.gcp_project_id }} \
            || \
          gcloud api-gateway gateways update ${GATEWAY_ID} \
            --api=${API_ID} \
            --api-config=${CONFIG_ID} \
            --location=${{ env.region }} \
            --project=${{ env.gcp_project_id }}
            
          echo "Gateway '${GATEWAY_ID}' deployed and updated to config '${CONFIG_ID}'"