name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      # These paths are now more specific to your service code
      - 'services/**.py'
      - 'services/**/pyproject.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13' # 3.13 might not be in buildpacks yet -- gotta check in the docs myself
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    - name: Install dependencies
      run: uv sync --dev
    - name: Run tests
      run: uv run pytest tests/ -v --cov=services

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: 'processor'
            path: 'services/processor'  # <-- ADDED: Path to the specific service's code
            entry_point: 'process'  # <-- This must match your *real* function name
            trigger_http: true
          - name: 'reporter'
            path: 'services/reporter' # <-- ADDED: Path to the specific service's code
            entry_point: 'report' # <-- This must match your *real* function name
            trigger_topic: 'reporter'

    steps:
    - uses: actions/checkout@v5

    - name: Load Configuration from yml
      id: read_config
      run: |
        yq e 'to_entries | .[] | select(.value | (tag != "!!map" and tag != "!!seq")) | .key + "=" + .value' config.yml >> $GITHUB_ENV

    - name: 'Authenticate to Google Cloud'
      id: 'auth'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'deploy-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

    - name: 'Deploy ${{ matrix.service.name }}'
      id: 'deploy'
      # --- CHANGED: Using the Cloud Run action ---
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        # 'name' is now 'service'
        service: ${{ matrix.service.name }}
        region: ${{ env.region }}
        
        # 'source_dir' is now 'source' and points to our matrix path
        source: ${{ matrix.service.path }}

        # --- How the entry_point is set ---
        # We pass the entry point as an env var that the
        # Google Buildpack knows how to read.
        env_vars: |
          GOOGLE_FUNCTION_TARGET=${{ matrix.service.entry_point }}