name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    - name: Install dependencies
      run: uv sync --dev
    - name: Run tests
      run: uv run pytest tests/ -v --cov=services

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        function:
          - name: 'synapse-ingestion'
            entry_point: 'ingestion_function'
            trigger_http: true
          - name: 'synapse-reporting'
            entry_point: 'reporting_function'
            trigger_topic: 'synapse-reporting'

    steps:
    - uses: actions/checkout@v5

    - name: 'Install yq to parse YAML'
      run: sudo wget https://github.com/mikefarah/yq/releases/download/v4.48.1/yq_linux_arm64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

    - name: 'Read configuration from config.yaml'
      id: 'read_config'
      run: |
        echo "GCP_PROJECT_ID=$(yq e '.gcp_project_id' config.yaml)" >> $GITHUB_ENV
        echo "GCP_REGION=$(yq e '.gcp_region' config.yaml)" >> $GITHUB_ENV

    - name: 'Authenticate to Google Cloud'
      id: 'auth'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: 'Deploy ${{ matrix.function.name }}'
      id: 'deploy'
      uses: 'google-github-actions/deploy-cloud-functions@v4'
      with:
        name: ${{ matrix.function.name }}
        entry_point: ${{ matrix.function.entry_point }}
        region: ${{ env.GCP_REGION }}
        runtime: 'python312'
        source_dir: '.'

    - name: 'Update Deployment Summary'
      run: |
        # Write the header only on the first run of the matrix
        if [ ${{ strategy.job-index }} -eq 0 ]; then
          echo "## Deployment Successful! ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Function | Region | Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        fi

        # Determine the trigger type for the summary table
        TRIGGER_TYPE="HTTP"
        if [ -n "${{ matrix.function.trigger_topic }}" ]; then
          TRIGGER_TYPE="Pub/Sub (${{ matrix.function.trigger_topic }})"
        fi
        
        # Append a row for the currently deployed function
        echo "| **${{ matrix.function.name }}** | \`${{ env.GCP_REGION }}\` | ${TRIGGER_TYPE} |" >> $GITHUB_STEP_SUMMARY
        
        # If the function is HTTP-triggered, add its URL to the summary
        if [ "${{ matrix.function.trigger_http }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **${{ matrix.function.name }} URL:**" >> $GITHUB_STEP_SUMMARY
            echo "\`${{ steps.deploy.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
        fi