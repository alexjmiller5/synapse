name: Deploy Synapse Application

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'workers/**' # NEW: Watch the workers directory
      - 'pyproject.toml'
      - 'uv.lock'
      - 'config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: intaker # RENAMED
            path: services/intaker # RENAMED
          - name: reporter
            path: services/reporter
          - name: processor # NEW
            path: workers/processor # NEW
    defaults:
      run:
        working-directory: ${{ matrix.service.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13' # TODO: see if a higher version is available for this action

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install service + test deps
        run: |
          echo "TODO: When implement tests, install test dependencies here!"  
        # uv sync --frozen --all-extras

      - name: Run tests
        run: |
          echo "TODO: Implement tests!"  
        # uv run pytest tests/ -v --cov=src --cov-report=term-missing

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: intaker # RENAMED
            path: services/intaker # RENAMED
            entry_point: intaker # RENAMED
            trigger_http: true
            api_spec_template: "api-gateways/processor-spec-template.yml"
          - name: reporter
            path: services/reporter
            entry_point: report
            trigger_topic: reporter
            api_spec_template: ""
          - name: processor # NEW
            path: workers/processor # NEW
            entry_point: process_job # NEW
            trigger_topic: processor-jobs # NEW
            api_spec_template: ""

    steps:
      - uses: actions/checkout@v5

      - name: Load config
        run: |
          yq e 'to_entries | .[] | select(.value | type != "object" and type != "array") | .key + "=" + .value' config.yml >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Generate requirements.txt
        run: |
          cd ${{ matrix.service.path }}
          
          if [ -f "pyproject.toml" ]; then
            echo "Exporting dependencies using uv..."
            uv pip compile pyproject.toml -o requirements.txt
            echo "Generated requirements.txt:"
            cat requirements.txt
          else
            echo "No pyproject.toml found, checking for existing requirements.txt..."
            if [ ! -f "requirements.txt" ]; then
              echo "❌ No dependency files found - deployment may fail"
              exit 1
            fi
          fi
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ env.gcp_project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'deploy-sa@${{ env.gcp_project_id }}.iam.gserviceaccount.com'

      - name: Deploy ${{ matrix.service.name }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service.name }}
          region: ${{ env.region }}
          source: ${{ matrix.service.path }}
          env_vars: |
            GOOGLE_FUNCTION_TARGET=${{ matrix.service.entry_point }}
          # UPDATED: Simplified flags, as all services should be private
          # The intaker service is invoked by the Gateway SA
          # The others are invoked by Eventarc
          flags: >-
            --function=${{ matrix.service.entry_point }}
            --no-allow-unauthenticated

